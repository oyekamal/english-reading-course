<title>Read English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#18202A; --muted:#5A6570; --line:#DCE1DE;
  --accent:#1F6F5C; --accent-soft:#E2EFEA; --mark:#F4DA6B; --story:#FBFBF6;
  --ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --read:"Literata", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --bg:#11161A; --surface:#182026; --ink:#E4E8EA; --muted:#98A3AB; --line:#2A343C;
  --accent:#62C3A6; --accent-soft:#1D3530; --mark:#6B5A12; --story:#1B242A; } }
:root[data-theme="dark"]{ color-scheme:dark; --bg:#11161A; --surface:#182026; --ink:#E4E8EA; --muted:#98A3AB; --line:#2A343C;
  --accent:#62C3A6; --accent-soft:#1D3530; --mark:#6B5A12; --story:#1B242A; }

html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:16px; line-height:1.5}
.app{display:grid; grid-template-columns:300px minmax(0,1fr); height:100%}
nav{background:var(--surface); border-right:1px solid var(--line); overflow-y:auto; padding-block:20px; padding-inline:16px; display:flex; flex-direction:column; gap:14px}
.brand{display:flex; flex-direction:column; gap:2px}
.brand b{font-family:var(--read); font-size:22px; letter-spacing:-.01em}
.brand span{color:var(--muted); font-size:13px}
#q{width:100%; box-sizing:border-box; font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink)}
#q:focus-visible, a:focus-visible, summary:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
details.group{border-top:1px solid var(--line); padding-top:8px}
details.group summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-weight:700; font-size:14px; padding-block:4px}
details.group summary::-webkit-details-marker{display:none}
.band{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:99px; white-space:nowrap; font-variant-numeric:tabular-nums}
.group ul{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column}
.group a{display:block; color:var(--ink); text-decoration:none; font-size:14px; padding:5px 8px; border-radius:5px}
.group a:hover{background:var(--bg)}
.group a[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:700}
main{overflow-y:auto; padding-inline:16px}
article{max-width:70ch; margin-inline:auto; padding-block:36px 80px; font-family:var(--read); font-size:17.5px; line-height:1.65}
.crumb{font-family:var(--ui); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
article h1{font-size:34px; line-height:1.15; letter-spacing:-.015em; margin:0 0 20px; text-wrap:balance}
article h2{font-size:23px; line-height:1.25; margin:40px 0 10px; padding-top:18px; border-top:1px solid var(--line); text-wrap:balance}
article h3{font-family:var(--ui); font-size:17px; margin:28px 0 6px}
article h4{font-family:var(--ui); font-size:15px; margin:20px 0 4px}
article p, article li{text-wrap:pretty}
article a{color:var(--accent); text-underline-offset:2px}
article strong{font-weight:700}
article blockquote{margin:18px 0; padding:14px 18px; background:var(--story); border:1px solid var(--line); border-radius:8px; font-size:19px; line-height:1.75}
article blockquote p{margin:0 0 8px} article blockquote p:last-child{margin:0}
article code{font-family:var(--mono); font-size:.86em; background:var(--bg); padding:1px 5px; border-radius:4px}
article pre{font-family:var(--mono); font-size:13.5px; background:var(--bg); border:1px solid var(--line); padding:12px 14px; border-radius:6px; overflow-x:auto; line-height:1.5}
article pre code{background:none; padding:0}
.tablewrap{overflow-x:auto; margin:16px 0}
article table{border-collapse:collapse; font-family:var(--ui); font-size:14.5px; min-width:100%; font-variant-numeric:tabular-nums}
article th, article td{border-bottom:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top}
article th{font-weight:700; color:var(--muted); font-size:12.5px; letter-spacing:.04em; text-transform:uppercase}
article hr{border:0; border-top:1px solid var(--line); margin:32px 0}
article mark{background:var(--mark); color:inherit; padding:0 2px}
.pager{display:flex; justify-content:space-between; gap:12px; margin-top:48px; font-family:var(--ui)}
.pager a{flex:1; display:flex; flex-direction:column; gap:2px; text-decoration:none; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px 14px; background:var(--surface)}
.pager a:hover{border-color:var(--accent)}
.pager small{color:var(--muted); font-size:12px}
.pager .next{text-align:right}
#menu{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr; grid-template-rows:auto 1fr}
  nav{border-right:0; border-bottom:1px solid var(--line); max-height:none; padding-block:12px}
  nav.closed > :not(.top){display:none}
  .top{display:flex; justify-content:space-between; align-items:center; gap:10px}
  #menu{display:inline-block; font:inherit; font-size:14px; font-weight:700; padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); cursor:pointer}
  article{padding-block:22px 60px; font-size:17px}
  article h1{font-size:28px}
}
@media (prefers-reduced-motion: no-preference){ .group a{transition:background .12s} }
</style>

<div class="app">
  <nav id="nav" class="closed">
    <div class="top">
      <div class="brand"><b>Read English</b><span>Beginner to C1 · any age · research-backed</span></div>
      <button id="menu" type="button" aria-expanded="false" aria-controls="nav">Contents</button>
    </div>
    <input id="q" type="search" placeholder="Search lessons (e.g. ai, schwa, Partition)" aria-label="Search lessons">
    <div id="groups"></div>
  </nav>
  <main id="main"><article id="doc"></article></main>
</div>

<script id="data" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const groups = JSON.parse(document.getElementById('data').textContent);
const flat = []; groups.forEach(g => g.docs.forEach(d => { d.group = g.name; flat.push(d); }));
const byId = Object.fromEntries(flat.map(d => [d.id, d]));
const byPath = Object.fromEntries(flat.map(d => [d.path, d]));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function buildNav(filter){
  const q = (filter||'').trim().toLowerCase();
  const cur = location.hash.slice(1);
  document.getElementById('groups').innerHTML = groups.map(g => {
    const docs = g.docs.filter(d => !q || d.title.toLowerCase().includes(q) || d.md.toLowerCase().includes(q));
    if (!docs.length) return '';
    const open = q || docs.some(d => d.id === cur) || (!cur && g === groups[0]);
    return `<details class="group"${open?' open':''}><summary><span>${esc(g.name)}</span>${g.band?`<span class="band">${esc(g.band)}</span>`:''}</summary><ul>` +
      docs.map(d => `<li><a href="#${d.id}"${d.id===cur?' aria-current="page"':''}>${esc(d.title)}</a></li>`).join('') + '</ul></details>';
  }).join('');
}

function resolve(from, href){
  const parts = from.split('/'); parts.pop();
  href.split('#')[0].split('/').forEach(p => { if (p === '..') parts.pop(); else if (p && p !== '.') parts.push(p); });
  return parts.join('/');
}

function show(id){
  const d = byId[id] || flat[0];
  const el = document.getElementById('doc');
  const html = marked.parse(d.md, {gfm:true});
  const i = flat.indexOf(d), prev = flat[i-1], next = flat[i+1];
  el.innerHTML = `<div class="crumb">${esc(d.group)}</div>` + html +
    `<div class="pager">${prev?`<a href="#${prev.id}"><small>Previous</small>${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="next" href="#${next.id}"><small>Next</small>${esc(next.title)}</a>`:'<span></span>'}</div>`;
  el.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className='tablewrap'; t.replaceWith(w); w.appendChild(t); });
  el.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; return; }
    if (h.startsWith('#')) return;
    const t = byPath[resolve(d.path, h)] || byPath[resolve(d.path, h).replace(/\/$/, '') + '/README.md'];
    if (t) a.setAttribute('href', '#' + t.id); else a.removeAttribute('href');
  });
  document.title = d.title === 'About this course' ? 'Read English' : d.title + ' · Read English';
  document.getElementById('main').scrollTop = 0;
  buildNav(document.getElementById('q').value);
}

window.addEventListener('hashchange', () => { show(location.hash.slice(1)); closeMenu(); });
document.getElementById('q').addEventListener('input', e => buildNav(e.target.value));
const nav = document.getElementById('nav'), menu = document.getElementById('menu');
function closeMenu(){ nav.classList.add('closed'); menu.setAttribute('aria-expanded','false'); }
menu.addEventListener('click', () => { const c = nav.classList.toggle('closed'); menu.setAttribute('aria-expanded', String(!c)); });
show(location.hash.slice(1));
</script>
